name: Android build & release

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional: a dedicated release keystore. Without it the build keeps the
      # fixed Expo debug key, which is the same certificate the existing
      # sideloaded releases use, so updates still install over them.
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Typecheck
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Validate release metadata
        working-directory: mobile
        run: npx expo config --type public --json > /tmp/rupeesplit-expo-config.json

      # Android only installs an update when versionCode rises. Derive it from the
      # run number so every build is installable over the previous one.
      - name: Stamp build version
        id: version
        working-directory: mobile
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const run = Number(process.env.RUN_NUMBER || 1)
          const code = 1000 + run
          const name = `2.0.${run}`
          const config = JSON.parse(fs.readFileSync('app.json', 'utf8'))
          config.expo.android.versionCode = code
          config.expo.version = name
          fs.writeFileSync('app.json', JSON.stringify(config, null, 2) + '\n')
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `code=${code}\nname=${name}\n`)
          console.log(`versionCode=${code} versionName=${name}`)
          NODE

      - name: Prebuild Android
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_BASE: https://rupeetrail-api.mogantipranavraj.workers.dev
          EXPO_PUBLIC_VERSION_CODE: ${{ steps.version.outputs.code }}
          EXPO_PUBLIC_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: npx expo prebuild --platform android --no-install

      # A universal APK carries every ABI and lands around 110 MB. Splitting by
      # ABI gives a ~40 MB arm64 build (every modern phone) plus a 32-bit build.
      - name: Split the APK by ABI
        working-directory: mobile/android/app
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const path = 'build.gradle'
          let gradle = fs.readFileSync(path, 'utf8')
          if (gradle.includes('splits {')) {
            console.log('ABI splits already present')
            process.exit(0)
          }
          gradle = gradle.replace(
            /android\s*{/,
            `android {\n    splits {\n        abi {\n            enable true\n            reset()\n            include "armeabi-v7a", "arm64-v8a"\n            universalApk false\n        }\n    }`
          )
          fs.writeFileSync(path, gradle)
          console.log('ABI splits added')
          NODE

      - name: Decode keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        working-directory: mobile/android
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/rupeetrail-release.jks

      - name: Wire release signing
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        working-directory: mobile/android
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const path = 'app/build.gradle'
          let gradle = fs.readFileSync(path, 'utf8')
          if (!gradle.includes('signingConfigs.release')) {
            gradle = gradle.replace(
              /signingConfigs\s*{/,
              `signingConfigs {\n        release {\n            storeFile file("rupeetrail-release.jks")\n            storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")\n            keyAlias System.getenv("RELEASE_KEY_ALIAS")\n            keyPassword System.getenv("RELEASE_KEY_PASSWORD")\n        }`
            )
            // Point only the release build type at the release key, leaving the
            // generated debug signing alone. Scope the edit to buildTypes first.
            const idx = gradle.indexOf('buildTypes {')
            const head = gradle.slice(0, idx)
            const tail = gradle.slice(idx)
            const rel = tail.indexOf('release {')
            const fixed =
              tail.slice(0, rel) +
              tail.slice(rel).replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
            gradle = head + fixed
            fs.writeFileSync(path, gradle)
            console.log('release signing wired')
          } else {
            console.log('release signing already present')
          }
          NODE

      # Metro inlines EXPO_PUBLIC_* when it bundles during assembleRelease, so
      # these must be present here too — not just on the prebuild step. Without
      # them the app thinks it is version 1 and nags to install its own build.
      - name: Build release APKs
        working-directory: mobile/android
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          EXPO_PUBLIC_API_BASE: https://rupeetrail-api.mogantipranavraj.workers.dev
          EXPO_PUBLIC_VERSION_CODE: ${{ steps.version.outputs.code }}
          EXPO_PUBLIC_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify the APKs
        working-directory: mobile/android
        run: |
          OUT=app/build/outputs/apk/release
          ARM64=$OUT/app-arm64-v8a-release.apk
          ARM32=$OUT/app-armeabi-v7a-release.apk
          test -f "$ARM64"
          test -f "$ARM32"
          ls -lh "$OUT"/*.apk
          cp "$ARM64" "$OUT/app-release.apk"
          sha256sum "$ARM64" | sed "s#  .*#  app-release.apk#" > "$OUT/app-release.apk.sha256"
          sha256sum "$ARM32" | sed "s#  .*#  app-arm32.apk#" > "$OUT/app-arm32.apk.sha256"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$ARM64" | head -5
          "$BUILD_TOOLS/aapt" dump badging "$ARM64" | grep -E "package:|application-label:|native-code:" | head -4
          # The updater compares the bundle's copy of the version with the
          # manifest; a bundle built without the env vars would claim version 1
          # and keep offering this very APK forever. Fail the release instead.
          unzip -p "$ARM64" assets/index.android.bundle > /tmp/rupeesplit-bundle.js
          test -s /tmp/rupeesplit-bundle.js
          grep -q "${{ steps.version.outputs.name }}" /tmp/rupeesplit-bundle.js
          grep -q "rupeetrail-api.mogantipranavraj.workers.dev" /tmp/rupeesplit-bundle.js
          echo "Bundle carries ${{ steps.version.outputs.name }} and the production API"

      - name: Publish the stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          # The deployed Worker's update manifest points at this stable URL, so
          # replacing the asset here ships a new APK without touching Cloudflare.
          gh release view main >/dev/null 2>&1 || gh release create main \
            --title "RupeeSplit (stable)" \
            --notes "Latest signed RupeeSplit Android build for in-app updates."
          gh release edit main --draft=false --prerelease=false --latest
          OUT=mobile/android/app/build/outputs/apk/release
          gh release upload main \
            "$OUT/app-release.apk#app-release.apk" \
            "$OUT/app-release.apk.sha256#app-release.apk.sha256" \
            "$OUT/app-armeabi-v7a-release.apk#app-arm32.apk" \
            "$OUT/app-arm32.apk.sha256#app-arm32.apk.sha256" \
            --clobber

      # The API worker reads this file on /api/app/releases, so publishing the
      # APK and its manifest is the whole release. It runs after the APK upload
      # so the app never sees a manifest for a file that is not downloadable yet.
      - name: Publish the update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE: ${{ steps.version.outputs.code }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          OUT=mobile/android/app/build/outputs/apk/release
          APK_SHA=$(cut -d' ' -f1 "$OUT/app-release.apk.sha256")
          APK_SIZE=$(stat -c%s "$OUT/app-release.apk")
          export APK_SHA APK_SIZE
          node - "$OUT/version.json" <<'NODE'
          const fs = require('fs')
          const manifest = {
            versionCode: Number(process.env.CODE),
            versionName: process.env.NAME,
            apkUrl: 'https://github.com/m-pranavraj/rupeetrail/releases/download/main/app-release.apk',
            sha256: process.env.APK_SHA,
            sizeBytes: Number(process.env.APK_SIZE),
            notes: `RupeeSplit ${process.env.NAME} — live balances, one-tap settlements and a faster ledger.`,
            // Raise this only when old clients must stop working. A high value
            // would trap anyone whose download fails behind a blocking screen.
            minSupportedCode: 1,
          }
          fs.writeFileSync(process.argv[2], JSON.stringify(manifest, null, 2) + '\n')
          console.log(JSON.stringify(manifest))
          NODE
          gh release upload main "$OUT/version.json#version.json" --clobber

      - name: Publish a versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          OUT=mobile/android/app/build/outputs/apk/release
          TAG="v$NAME"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "RupeeSplit $NAME" \
            --notes "RupeeSplit $NAME (versionCode ${{ steps.version.outputs.code }}). arm64 is the main build; arm32 covers older phones." \
            --latest=false
          gh release upload "$TAG" \
            "$OUT/app-release.apk#RupeeSplit-$NAME-arm64.apk" \
            "$OUT/app-release.apk.sha256#RupeeSplit-$NAME-arm64.apk.sha256" \
            "$OUT/app-armeabi-v7a-release.apk#RupeeSplit-$NAME-arm32.apk" \
            "$OUT/app-arm32.apk.sha256#RupeeSplit-$NAME-arm32.apk.sha256" \
            --clobber

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rupeesplit-apk-${{ github.run_number }}
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            mobile/android/app/build/outputs/apk/release/app-release.apk.sha256
          retention-days: 30
